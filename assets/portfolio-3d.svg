<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="3D Portfolio">
  <title>3D Portfolio — Ahmed Yarhan Sulaiman</title>
  <desc>Animasi 3D bergaya portfolio: starfield, grid perspektif, dan energy orb ala JARVIS.</desc>

  <defs>
    <linearGradient id="p3dBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05050a"/>
      <stop offset="0.6" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#100a20"/>
    </linearGradient>
    <radialGradient id="p3dHorizon" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#7c6dfa" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7c6dfa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7c6dfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3dOrb" cx="0.35" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#7c6dfa"/>
      <stop offset="1" stop-color="#241a52"/>
    </radialGradient>
    <linearGradient id="p3dGrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7c6dfa" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="p3dText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="p3dGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="p3dSoftGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="p3dFrame"><rect x="0" y="0" width="900" height="320" rx="18"/></clipPath>
    <clipPath id="p3dFloor"><rect x="0" y="190" width="900" height="130"/></clipPath>
  </defs>

  <g clip-path="url(#p3dFrame)">
    <rect x="0" y="0" width="900" height="320" fill="url(#p3dBg)"/>
    <ellipse cx="450" cy="190" rx="620" ry="210" fill="url(#p3dHorizon)"/>

    <!-- ===== starfield ===== -->
    <g fill="#c4b5fd">
      <circle cx="60" cy="40" r="1.4" opacity="0.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="90" r="1" opacity="0.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="35" r="1.2" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="120" r="1" opacity="0.2"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.6s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="60" r="1.3" opacity="0.2"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.7s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="100" r="1" opacity="0.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.3s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="45" r="1.4" opacity="0.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" begin="2.0s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="130" r="1" opacity="0.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.8s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="70" r="1.2" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="110" r="1" opacity="0.2"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.0s" begin="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="152" r="1" opacity="0.2"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.9s" begin="1.0s" repeatCount="indefinite"/></circle>
      <circle cx="200" cy="172" r="0.9" opacity="0.2"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.5s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="150" r="1" opacity="0.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.6s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="162" r="1" opacity="0.2"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.2s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="150" r="0.9" opacity="0.2"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.7s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="168" r="1" opacity="0.2"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.3s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="90" r="1" opacity="0.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.4s" begin="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="80" r="0.9" opacity="0.2"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.8s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="30" r="1" opacity="0.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" begin="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="178" r="0.9" opacity="0.2"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.9s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="25" r="1.1" opacity="0.2"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.4s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="160" r="0.9" opacity="0.2"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.1s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="370" cy="100" r="0.9" opacity="0.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.9s" begin="0.1s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="40" r="1.1" opacity="0.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ===== perspective floor grid ===== -->
    <g clip-path="url(#p3dFloor)" stroke="url(#p3dGrid)" stroke-width="1" fill="none" opacity="0.5">
      <line x1="450" y1="190" x2="-510" y2="360"/>
      <line x1="450" y1="190" x2="-390" y2="360"/>
      <line x1="450" y1="190" x2="-270" y2="360"/>
      <line x1="450" y1="190" x2="-150" y2="360"/>
      <line x1="450" y1="190" x2="-30" y2="360"/>
      <line x1="450" y1="190" x2="90" y2="360"/>
      <line x1="450" y1="190" x2="210" y2="360"/>
      <line x1="450" y1="190" x2="330" y2="360"/>
      <line x1="450" y1="190" x2="570" y2="360"/>
      <line x1="450" y1="190" x2="690" y2="360"/>
      <line x1="450" y1="190" x2="810" y2="360"/>
      <line x1="450" y1="190" x2="930" y2="360"/>
      <line x1="450" y1="190" x2="1050" y2="360"/>
      <line x1="450" y1="190" x2="1170" y2="360"/>
      <line x1="450" y1="190" x2="1290" y2="360"/>
    </g>
    <g clip-path="url(#p3dFloor)" stroke="url(#p3dGrid)" stroke-width="1" fill="none" opacity="0.42">
      <line x1="0" y1="194" x2="900" y2="194"/>
      <line x1="0" y1="199" x2="900" y2="199"/>
      <line x1="0" y1="207" x2="900" y2="207"/>
      <line x1="0" y1="219" x2="900" y2="219"/>
      <line x1="0" y1="236" x2="900" y2="236"/>
      <line x1="0" y1="260" x2="900" y2="260"/>
      <line x1="0" y1="293" x2="900" y2="293"/>
    </g>

    <!-- traveling light pulses toward the viewer -->
    <g fill="#c4b5fd" filter="url(#p3dGlow)">
      <circle r="2.4" opacity="0">
        <animate attributeName="cx" values="450;633" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="190;320" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.4" opacity="0">
        <animate attributeName="cx" values="450;266" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="190;320" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle r="2" opacity="0">
        <animate attributeName="cx" values="450;817" dur="3.1s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="190;320" dur="3.1s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="3.1s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="2" opacity="0">
        <animate attributeName="cx" values="450;83" dur="3.1s" begin="2.0s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="190;320" dur="3.1s" begin="2.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="3.1s" begin="2.0s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ===== JARVIS energy orb ===== -->
    <g transform="translate(450,148)">
      <circle r="72" fill="#7c6dfa" opacity="0.28" filter="url(#p3dSoftGlow)">
        <animate attributeName="opacity" values="0.18;0.42;0.18" dur="3.6s" repeatCount="indefinite"/>
      </circle>

      <g opacity="0.75">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        <ellipse rx="94" ry="33" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
      </g>
      <g opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="12s" repeatCount="indefinite"/>
        <ellipse rx="33" ry="94" fill="none" stroke="#34d399" stroke-width="1.2"/>
      </g>

      <circle r="52" fill="url(#p3dOrb)" filter="url(#p3dGlow)">
        <animate attributeName="r" values="52;56;52" dur="3.2s" repeatCount="indefinite"/>
      </circle>

      <circle r="52" fill="none" stroke="#c4b5fd" stroke-width="1.6">
        <animate attributeName="r" values="52;122" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="52" fill="none" stroke="#a78bfa" stroke-width="1.2">
        <animate attributeName="r" values="52;122" dur="3s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ===== labels ===== -->
    <text x="30" y="292" font-family="'Space Mono',Consolas,monospace" font-size="15" letter-spacing="4" fill="url(#p3dText)">AYS.DEV — 3D PORTFOLIO</text>
    <text x="870" y="292" text-anchor="end" font-family="'Space Mono',Consolas,monospace" font-size="12" letter-spacing="3" fill="#34d399" opacity="0.8">SCROLL TO TRAVEL</text>

    <!-- border -->
    <rect x="1" y="1" width="898" height="318" rx="18" fill="none" stroke="#7c6dfa" stroke-width="1.4" opacity="0.5"/>
  </g>
</svg>
