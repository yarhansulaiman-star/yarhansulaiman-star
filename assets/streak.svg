    </g>
    <g class="rise" style="animation-delay:0.35s">
      <text x="213" y="205" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" fill="#e2e8f0" letter-spacing="0.5">Total Contributions</text>
