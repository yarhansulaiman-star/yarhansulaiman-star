    <g transform="translate(640,26) scale(1.5)">
      <path class="flame" d="M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z" fill="#a78bfa"/>
    </g>
    <g class="rise" style="animation-delay:0.45s">
      <text x="640" y="126" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-weight="700" font-size="60" fill="#c4b5fd" class="pulse">2</text>
    </g>
    <g class="rise" style="animation-delay:0.6s">
      <text x="640" y="205" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-weight="700" font-size="19" fill="#a78bfa" letter-spacing="0.5">Current Streak</text>
    </g>
    <g class="rise" style="animation-delay:0.75s">
      <text x="640" y="241" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#94a3b8">Sep 23 - Sep 24</text>
    </g>

    <!-- Longest Streak -->

    <!-- Longest Streak -->
    <g class="rise" style="animation-delay:0.2s">
      <text x="1067" y="126" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-weight="700" font-size="60" fill="#e2e8f0" class="pulse">3</text>
    </g>
    <g class="rise" style="animation-delay:0.4s">
      <text x="1067" y="205" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" fill="#e2e8f0" letter-spacing="0.5">Longest Streak</text>
    </g>
    <g class="rise" style="animation-delay:0.55s">
      <text x="1067" y="241" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#94a3b8">Apr 18 - Apr 20</text>
    </g>

    <g transform="skewX(-18)" opacity="0.9">
