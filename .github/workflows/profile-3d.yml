name: generate 3d contribution graph

on:
  # jalan otomatis tiap 24 jam (18:00 UTC = 01:00 WIB)
  schedule:
    - cron: "0 18 * * *"
  # bisa dijalankan manual dari tab Actions
  workflow_dispatch:
  # jalan setiap kali push ke branch main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      # SIMPAN SVG ke branch terpisah agar repo utama tetap bersih
      - name: push SVGs to output-3d-contrib branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-3d-contrib
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
